<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">The path from attention to remembering</title><desc id="desc">Information moves through attention, taking it in, storing it and finding it again. Difficulty at any step can feel like forgetting.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17324d">Remembering has several steps</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="19" font-weight="700"><rect x="40" y="120" width="170" height="90" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="125" y="175">Notice</text><rect x="255" y="120" width="170" height="90" rx="18" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="340" y="175">Take it in</text><rect x="470" y="120" width="170" height="90" rx="18" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="555" y="175">Store it</text><rect x="685" y="120" width="170" height="90" rx="18" fill="#fff" stroke="#a66500" stroke-width="4"/><text x="770" y="175">Find it again</text></g>
  <g stroke="#17324d" stroke-width="5" fill="none"><path d="M210 165h35"/><path d="M425 165h35"/><path d="M640 165h35"/></g><text x="450" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17324d">A break at any step can feel like “my memory failed.”</text>
</svg>
