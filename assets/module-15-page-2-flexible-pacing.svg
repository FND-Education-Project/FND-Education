<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Four parts of a flexible activity plan</title>
  <desc id="desc">Four cards show essential tasks, valued activities, supports, and recovery. Curved arrows indicate that the arrangement can change. A note says rest and support are parts of participation.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">A flexible plan makes room for life</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="45" y="92" width="190" height="92" rx="18" fill="#fff" stroke="#2e6e9e" stroke-width="3"/><text x="140" y="123" font-size="19" font-weight="700">Essential</text><text x="140" y="150" font-size="15">What cannot</text><text x="140" y="171" font-size="15">wait?</text>
    <rect x="252" y="92" width="190" height="92" rx="18" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="347" y="123" font-size="19" font-weight="700">Valued</text><text x="347" y="150" font-size="15">Why does today</text><text x="347" y="171" font-size="15">matter?</text>
    <rect x="459" y="92" width="190" height="92" rx="18" fill="#fff0c7" stroke="#a86700" stroke-width="3"/><text x="554" y="123" font-size="19" font-weight="700">Support</text><text x="554" y="150" font-size="15">What reduces</text><text x="554" y="171" font-size="15">load?</text>
    <rect x="666" y="92" width="190" height="92" rx="18" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="761" y="123" font-size="19" font-weight="700">Recovery</text><text x="761" y="150" font-size="15">What comes</text><text x="761" y="171" font-size="15">before or after?</text>
  </g>
  <path d="M140 202 C260 258 640 258 761 202" fill="none" stroke="#17324d" stroke-width="3"/>
  <path d="M753 211 l8 -9 -12 -2" fill="#17324d"/>
  <path d="M761 224 C640 286 260 286 140 224" fill="none" stroke="#17324d" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M148 233 l-8 -9 12 -2" fill="#17324d"/>
  <text x="450" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Support and rest are parts of participation—not rewards earned afterward.</text>
</svg>
