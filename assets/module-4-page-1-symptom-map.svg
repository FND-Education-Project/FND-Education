<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A personal symptom map keeps different information separate</title><desc id="desc">A one-page map has four simple sections for confirmed FND symptoms, other diagnoses or open questions, warnings and safety, and what helps or remains possible.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">A short map reduces the work of holding everything in memory</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="18" font-weight="700"><rect x="55" y="80" width="365" height="88" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="237" y="115">Confirmed FND</text><text x="237" y="142">symptoms</text><rect x="480" y="80" width="365" height="88" rx="18" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="662" y="115">Other diagnoses or</text><text x="662" y="142">open questions</text><rect x="55" y="198" width="365" height="88" rx="18" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="237" y="233">Warnings and</text><text x="237" y="260">safety</text><rect x="480" y="198" width="365" height="88" rx="18" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="662" y="233">What helps or</text><text x="662" y="260">remains possible</text></g>
</svg>
