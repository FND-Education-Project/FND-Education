<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Five parts of a useful function description</title>
  <desc id="desc">A function description includes the task, reliability, safety, recovery time and support needed. One successful attempt is not a full account.</desc>
  <rect width="900" height="330" rx="24" fill="#f3f0f8"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Describe function in real conditions</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="40" y="95" width="150" height="108" rx="16" fill="#fff" stroke="#39738c" stroke-width="3"/><text x="115" y="135" font-size="19" font-weight="700">Task</text><text x="115" y="166" font-size="15">doing what?</text>
    <rect x="207" y="95" width="150" height="108" rx="16" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="282" y="135" font-size="19" font-weight="700">Reliability</text><text x="282" y="166" font-size="15">how often?</text>
    <rect x="374" y="95" width="150" height="108" rx="16" fill="#fff" stroke="#9a3f36" stroke-width="3"/><text x="449" y="135" font-size="19" font-weight="700">Safety</text><text x="449" y="166" font-size="15">what risks?</text>
    <rect x="541" y="95" width="150" height="108" rx="16" fill="#fff" stroke="#a66a13" stroke-width="3"/><text x="616" y="135" font-size="19" font-weight="700">Recovery</text><text x="616" y="166" font-size="15">what follows?</text>
    <rect x="708" y="95" width="150" height="108" rx="16" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="783" y="135" font-size="19" font-weight="700">Support</text><text x="783" y="166" font-size="15">what help?</text>
  </g>
  <text x="450" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">One successful attempt does not describe a whole week.</text>
</svg>
