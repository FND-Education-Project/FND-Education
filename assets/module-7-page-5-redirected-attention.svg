<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Redirecting attention during movement retraining</title>
  <desc id="desc">One panel shows close monitoring of each step; another shows attention on a destination, rhythm or meaningful task.</desc>
  <rect width="900" height="320" rx="24" fill="#eef5f7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Attention can change how movement is accessed</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="45" y="78" width="365" height="200" rx="22" fill="#fff0c7" stroke="#a66500" stroke-width="4"/>
    <text x="227" y="116" font-size="22" font-weight="700" fill="#17324d">Watching every movement</text>
    <circle cx="155" cy="183" r="38" fill="none" stroke="#a66500" stroke-width="8"/><circle cx="155" cy="183" r="10" fill="#a66500"/>
    <path d="M207 183h125" stroke="#a66500" stroke-width="8" stroke-dasharray="8 11"/>
    <text x="227" y="250" font-size="18" fill="#17324d">can add effort for some people</text>
    <rect x="490" y="78" width="365" height="200" rx="22" fill="#d9f0e6" stroke="#18765b" stroke-width="4"/>
    <text x="672" y="116" font-size="22" font-weight="700" fill="#17324d">A target, rhythm or task</text>
    <path d="M555 220q70-110 140 0t105 0" fill="none" stroke="#18765b" stroke-width="8"/>
    <circle cx="795" cy="175" r="28" fill="#fff" stroke="#76509a" stroke-width="6"/><circle cx="795" cy="175" r="10" fill="#76509a"/>
    <text x="672" y="250" font-size="18" fill="#17324d">may make movement more automatic</text>
  </g>
</svg>
