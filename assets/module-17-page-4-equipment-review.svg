<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A goal-led equipment trial and review</title>
  <desc id="desc">A loop moves from choose a goal, to try the equipment, to notice benefits and burdens, to adjust or review, then returns to the goal.</desc>
  <rect width="900" height="330" rx="24" fill="#f3f0f8"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">A decision can be tried and reviewed</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="50" y="105" width="180" height="80" rx="18" fill="#fff" stroke="#39738c" stroke-width="3"/><text x="140" y="137" font-size="19" font-weight="700">Choose a goal</text><text x="140" y="163" font-size="15">one real activity</text>
    <rect x="260" y="105" width="165" height="80" rx="18" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="342" y="137" font-size="19" font-weight="700">Try</text><text x="342" y="163" font-size="15">fit and training</text>
    <rect x="455" y="92" width="205" height="106" rx="18" fill="#fff4dc" stroke="#a66a13" stroke-width="3"/><text x="557" y="126" font-size="19" font-weight="700">Notice</text><text x="557" y="154" font-size="15">benefit and burden</text><text x="557" y="178" font-size="15">during and after</text>
    <rect x="690" y="105" width="165" height="80" rx="18" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="772" y="137" font-size="19" font-weight="700">Review</text><text x="772" y="163" font-size="15">keep · adjust · stop</text>
    <g stroke="#39738c" stroke-width="4" fill="none"><path d="M232 145h24"/><path d="M427 145h24"/><path d="M662 145h24"/><path d="M772 202C745 278 175 278 140 202"/></g>
  </g>
  <text x="450" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">Needs may change. The decision can change too.</text>
</svg>
