<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Symptoms may worsen after a delay</title><desc id="desc">A small activity is followed by either a steady response or delayed symptom worsening. The person's pattern must be learned rather than assumed.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Activity and worsening may be separated in time</text>
  <rect x="55" y="120" width="190" height="80" rx="18" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="150" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d">Activity</text><path d="M245 160h115" stroke="#17324d" stroke-width="5"/><circle cx="440" cy="160" r="55" fill="#d9f0e6" stroke="#18765b" stroke-width="4"/><text x="440" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">Steady</text><text x="440" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17324d">response</text><path d="M495 160h100" stroke="#17324d" stroke-width="5" stroke-dasharray="10 8"/><rect x="595" y="105" width="250" height="110" rx="20" fill="#f7d6d6" stroke="#a83b3b" stroke-width="4"/><text x="720" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d">Delayed worsening</text><text x="720" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#17324d">may occur later</text><text x="450" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324d">Learn the pattern; do not assume either path.</text>
</svg>
