<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Specialist guidance can support local care</title>
  <desc id="desc">A person and local clinician are connected to specialist guidance. Local boxes retain ordinary medical care and follow-up. A note says remote advice adds expertise but does not replace local responsibility.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Specialist knowledge can travel; responsibility stays named</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="48" y="95" width="220" height="92" rx="18" fill="#fff" stroke="#2e6e9e" stroke-width="3"/>
    <text x="158" y="127" font-size="18" font-weight="700">Person + local</text><text x="158" y="151" font-size="18" font-weight="700">clinician</text><text x="158" y="176" font-size="16">ongoing relationship</text>
    <rect x="340" y="78" width="220" height="126" rx="34" fill="#fff0c7" stroke="#a86700" stroke-width="3"/>
    <text x="450" y="119" font-size="19" font-weight="700">Specialist guidance</text><text x="450" y="149" font-size="16">consultation · training</text><text x="450" y="176" font-size="16">telehealth, when suitable</text>
    <rect x="632" y="82" width="220" height="70" rx="16" fill="#fff" stroke="#18785b" stroke-width="3"/>
    <text x="742" y="112" font-size="17" font-weight="700">Ordinary</text><text x="742" y="135" font-size="17" font-weight="700">medical care</text>
    <rect x="632" y="174" width="220" height="70" rx="16" fill="#fff" stroke="#7350a0" stroke-width="3"/>
    <text x="742" y="205" font-size="17" font-weight="700">Review and</text><text x="742" y="228" font-size="17" font-weight="700">follow-up</text>
  </g>
  <g stroke="#17324d" stroke-width="4" fill="none"><path d="M268 141 H340"/><path d="M560 132 H632"/><path d="M560 158 C595 158 595 209 632 209"/></g>
  <text x="450" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Remote advice adds expertise; it cannot replace every examination or emergency decision.</text>
</svg>
