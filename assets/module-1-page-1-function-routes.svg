<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Function can change while a nervous-system route remains available</title><desc id="desc">A nervous system sends information toward movement, sensation, attention and awareness. A changed-control panel affects access to these functions without implying that symptoms are voluntary.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">“Functional” describes how a system is working</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><rect x="45" y="112" width="190" height="100" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="140" y="151" font-size="20" font-weight="700">Nervous-system</text><text x="140" y="180" font-size="20" font-weight="700">information</text><rect x="355" y="94" width="190" height="136" rx="18" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="450" y="145" font-size="20" font-weight="700">Access or control</text><text x="450" y="176" font-size="18">can change</text><text x="450" y="202" font-size="18">involuntarily</text><rect x="665" y="82" width="190" height="160" rx="18" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="760" y="124" font-size="18" font-weight="700">Movement</text><text x="760" y="154" font-size="18" font-weight="700">Sensation</text><text x="760" y="184" font-size="18" font-weight="700">Attention</text><text x="760" y="214" font-size="18" font-weight="700">Awareness</text></g>
  <g stroke="#17324d" stroke-width="5" fill="none"><path d="M235 162h110"/><path d="M545 162h110"/></g><text x="450" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d">The symptom is real. The change is not chosen.</text>
</svg>
