<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A practice plan includes the later response</title>
  <desc id="desc">A sequence shows a chosen task, a small supported attempt, an immediate and later check, and three next steps: repeat, adapt, or review with a clinician.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">The whole practice includes what happens afterward</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="45" y="91" width="190" height="78" rx="17" fill="#fff" stroke="#2e6e9e" stroke-width="3"/><text x="140" y="123" font-size="18" font-weight="700">Chosen task</text><text x="140" y="148" font-size="16">clear reason</text>
    <rect x="277" y="91" width="190" height="78" rx="17" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="372" y="123" font-size="18" font-weight="700">Small attempt</text><text x="372" y="148" font-size="16">support + endpoint</text>
    <rect x="509" y="78" width="190" height="104" rx="17" fill="#fff0c7" stroke="#a86700" stroke-width="3"/><text x="604" y="116" font-size="18" font-weight="700">Check the effect</text><text x="604" y="144" font-size="16">during · soon after</text><text x="604" y="167" font-size="16">later</text>
  </g>
  <g stroke="#17324d" stroke-width="4"><path d="M235 130 H277"/><path d="M467 130 H509"/></g>
  <path d="M699 130 H751" stroke="#17324d" stroke-width="4"/>
  <circle cx="788" cy="130" r="38" fill="#fff" stroke="#7350a0" stroke-width="3"/>
  <text x="788" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">What</text><text x="788" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">next?</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" text-anchor="middle">
    <rect x="209" y="235" width="150" height="52" rx="14" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="284" y="267">Repeat</text>
    <rect x="375" y="235" width="150" height="52" rx="14" fill="#fff" stroke="#a86700" stroke-width="3"/><text x="450" y="267">Adapt</text>
    <rect x="541" y="235" width="190" height="52" rx="14" fill="#fff" stroke="#9a3f36" stroke-width="3"/><text x="636" y="267">Clinical review</text>
  </g>
  <path d="M788 168 C788 210 636 210 636 235 M788 168 C788 210 450 210 450 235 M788 168 C788 210 284 210 284 235" fill="none" stroke="#17324d" stroke-width="3"/>
</svg>
