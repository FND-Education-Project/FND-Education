<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Movement may differ across tasks</title>
  <desc id="desc">Two panels compare difficulty with a requested movement and movement becoming more available in another task.</desc>
  <rect width="900" height="320" rx="24" fill="#eef5f7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">The same movement system, different access</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="78" width="350" height="195" rx="22" fill="#ffffff" stroke="#a66500" stroke-width="4"/>
    <text x="230" y="116" font-size="23" font-weight="700" fill="#17324d">Requested movement</text>
    <path d="M150 225l35-70 42 25 50-48 45 93" fill="none" stroke="#a66500" stroke-width="9" stroke-linecap="round"/>
    <text x="230" y="255" font-size="18" fill="#17324d">may feel blocked</text>
    <path d="M425 175h50" stroke="#17324d" stroke-width="5"/><path d="M475 175l-15-10v20z" fill="#17324d"/>
    <rect x="495" y="78" width="350" height="195" rx="22" fill="#ffffff" stroke="#18765b" stroke-width="4"/>
    <text x="670" y="116" font-size="23" font-weight="700" fill="#17324d">Another or automatic task</text>
    <path d="M585 225c25-80 70-80 90 0s65 75 85 0" fill="none" stroke="#18765b" stroke-width="9" stroke-linecap="round"/>
    <text x="670" y="255" font-size="18" fill="#17324d">may reveal available movement</text>
  </g>
</svg>
