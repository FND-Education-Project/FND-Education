<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Consent continues and trauma work is optional</title>
  <desc id="desc">A path shows purpose, choice, boundaries, and review. A separate question asks whether trauma support is wanted, branching to wanted support or no trauma work.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Consent continues through treatment</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d" text-anchor="middle">
    <rect x="42" y="78" width="175" height="62" rx="15" fill="#fff" stroke="#2e6e9e" stroke-width="3"/><text x="130" y="115">Purpose</text>
    <rect x="255" y="78" width="175" height="62" rx="15" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="343" y="115">Choice</text>
    <rect x="468" y="78" width="175" height="62" rx="15" fill="#fff0c7" stroke="#a86700" stroke-width="3"/><text x="556" y="115">Boundaries</text>
    <rect x="681" y="78" width="175" height="62" rx="15" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="769" y="115">Review</text>
  </g>
  <g stroke="#17324d" stroke-width="4"><path d="M217 109 H255"/><path d="M430 109 H468"/><path d="M643 109 H681"/></g>
  <rect x="300" y="185" width="300" height="58" rx="18" fill="#fff" stroke="#7350a0" stroke-width="3"/>
  <text x="450" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Is trauma support wanted and relevant?</text>
  <path d="M450 140 V185 M380 243 V264 M520 243 V264" fill="none" stroke="#17324d" stroke-width="3"/>
  <rect x="240" y="264" width="210" height="48" rx="13" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="345" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">Wanted support</text>
  <rect x="470" y="264" width="210" height="48" rx="13" fill="#fff" stroke="#9a3f36" stroke-width="3"/><text x="575" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">No trauma work</text>
</svg>
