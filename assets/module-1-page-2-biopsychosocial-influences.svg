<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Biological, psychological and social factors can matter differently</title><desc id="desc">Three separate circles for body and brain, thoughts and feelings, and life and surroundings point toward an individual plan. A note says that no circle is required to cause FND.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Three areas to consider—not three required causes</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="18" font-weight="700"><circle cx="150" cy="145" r="82" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="150" y="139">Body and</text><text x="150" y="166">brain</text><circle cx="450" cy="145" r="82" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="450" y="139">Thoughts and</text><text x="450" y="166">feelings</text><circle cx="750" cy="145" r="82" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="750" y="139">Life and</text><text x="750" y="166">surroundings</text></g>
  <text x="450" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d">Ask what matters for this person and this decision.</text><text x="450" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324d">A factor can matter without being the cause of FND.</text>
</svg>
