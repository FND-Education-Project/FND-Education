<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Risk, trigger, warning and consequence belong at different times</title><desc id="desc">A timeline separates a possible vulnerability, a possible trigger, the start of a symptom, a warning sign and a consequence. The labels do not prove cause.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Similar words can describe different places in time</text>
  <path d="M75 180h750" stroke="#17324d" stroke-width="6"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><g font-size="18" font-weight="700"><circle cx="120" cy="180" r="16" fill="#356f99"/><text x="120" y="115">Possible risk</text><text x="120" y="140">or vulnerability</text><circle cx="310" cy="180" r="16" fill="#18765b"/><text x="310" y="128">Possible trigger</text><circle cx="485" cy="180" r="16" fill="#a66500"/><text x="485" y="128">Symptom begins</text><circle cx="650" cy="180" r="16" fill="#76509a"/><text x="650" y="216">Warning noticed</text><circle cx="805" cy="180" r="16" fill="#8b3a3a"/><text x="805" y="216">Consequence</text></g><text x="450" y="286" font-size="19">Timing helps organize a possibility; it does not prove what caused FND.</text></g>
</svg>
