<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Breathing and upper-airway symptoms can involve different areas</title>
  <desc id="desc">A simple side view labels the nose, throat, voice box and lungs to show why assessment should identify the symptom pattern.</desc>
  <rect width="900" height="330" rx="24" fill="#f7f5ef"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Similar feelings can come from different patterns</text>
  <g fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round">
    <path d="M230 95c-55 15-65 100-20 130 20 14 35 35 35 67"/>
    <path d="M228 115h58c30 0 36 34 14 49l-33 22v65"/>
    <path d="M267 251c-60-30-95 18-70 50M267 251c60-30 95 18 70 50"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="21" fill="#17324d">
    <circle cx="250" cy="122" r="8" fill="#356f99"/><path d="M258 122h105" stroke="#356f99" stroke-width="4"/><text x="378" y="129">Nose and upper airway</text>
    <circle cx="288" cy="169" r="8" fill="#76509a"/><path d="M296 169h67" stroke="#76509a" stroke-width="4"/><text x="378" y="176">Throat</text>
    <circle cx="267" cy="215" r="8" fill="#a66500"/><path d="M275 215h88" stroke="#a66500" stroke-width="4"/><text x="378" y="222">Voice box</text>
    <circle cx="230" cy="278" r="8" fill="#18765b"/><path d="M238 278h125" stroke="#18765b" stroke-width="4"/><text x="378" y="285">Lungs and breathing pattern</text>
  </g>
</svg>
