<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Before, during and after an appointment</title>
  <desc id="desc">Before the appointment bring a short summary, during it agree the priority, and after it record the plan. Preparation is shown as support rather than a test.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Let a short note carry some of the load</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="70" y="90" width="220" height="125" rx="18" fill="#fff" stroke="#39738c" stroke-width="3"/><text x="180" y="127" font-size="20" font-weight="700">Before</text><text x="180" y="160" font-size="16">one main need</text><text x="180" y="185" font-size="16">communication support</text>
    <rect x="340" y="90" width="220" height="125" rx="18" fill="#fff4dc" stroke="#a66a13" stroke-width="3"/><text x="450" y="127" font-size="20" font-weight="700">During</text><text x="450" y="160" font-size="16">agree priorities</text><text x="450" y="185" font-size="16">ask for plain language</text>
    <rect x="610" y="90" width="220" height="125" rx="18" fill="#e5f3eb" stroke="#18785b" stroke-width="3"/><text x="720" y="127" font-size="20" font-weight="700">After</text><text x="720" y="160" font-size="16">decision · action</text><text x="720" y="185" font-size="16">who · when</text>
  </g>
  <text x="450" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">You do not need a perfect story to deserve care.</text>
</svg>
