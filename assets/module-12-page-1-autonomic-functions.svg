<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Automatic body functions</title><desc id="desc">A central body-system label connects to heart rate and blood pressure, temperature and sweating, digestion, and bladder function. Each symptom can have several causes.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Autonomic names a system—not one diagnosis</text>
  <circle cx="450" cy="170" r="72" fill="#d9f0e6" stroke="#18765b" stroke-width="5"/><text x="450" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17324d">Automatic</text><text x="450" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17324d">regulation</text>
  <g stroke="#17324d" stroke-width="4"><path d="M378 155H265M522 155h113M395 215l-90 45M505 215l90 45"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="17" font-weight="700"><rect x="45" y="110" width="220" height="75" rx="16" fill="#fff" stroke="#a83b3b" stroke-width="4"/><text x="155" y="142">Heart rate and</text><text x="155" y="166">blood pressure</text><rect x="635" y="110" width="220" height="75" rx="16" fill="#fff" stroke="#a66500" stroke-width="4"/><text x="745" y="142">Temperature and</text><text x="745" y="166">sweating</text><rect x="95" y="245" width="210" height="60" rx="16" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="200" y="282">Digestion</text><rect x="595" y="245" width="210" height="60" rx="16" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="700" y="282">Bladder</text></g>
</svg>
