<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Five parts of therapy fit</title>
  <desc id="desc">A central question asks does this fit me. Five connected cards name target, approach, therapist, access, and review.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">A therapy is more than its name</text>
  <circle cx="450" cy="170" r="68" fill="#fff0c7" stroke="#a86700" stroke-width="3"/>
  <text x="450" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Does this</text><text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">fit me?</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d" text-anchor="middle">
    <rect x="54" y="82" width="180" height="58" rx="15" fill="#fff" stroke="#2e6e9e" stroke-width="3"/><text x="144" y="118">Target</text>
    <rect x="666" y="82" width="180" height="58" rx="15" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="756" y="118">Approach</text>
    <rect x="54" y="220" width="180" height="58" rx="15" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="144" y="256">Therapist</text>
    <rect x="666" y="220" width="180" height="58" rx="15" fill="#fff" stroke="#9a3f36" stroke-width="3"/><text x="756" y="256">Access</text>
    <rect x="360" y="264" width="180" height="50" rx="14" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="450" y="295">Review</text>
  </g>
  <g stroke="#17324d" stroke-width="3" fill="none"><path d="M234 111 L391 143"/><path d="M666 111 L509 143"/><path d="M234 249 L391 197"/><path d="M666 249 L509 197"/><path d="M450 238 V264"/></g>
</svg>
