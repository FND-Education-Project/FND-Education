<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A four-question check for health claims</title><desc id="desc">Four cards ask what was observed, what is only proposed, whether other explanations fit, and what decision would change.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Pause before turning a general claim into your story</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="18" font-weight="700"><rect x="55" y="82" width="365" height="82" rx="17" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="237" y="116">1. What was actually</text><text x="237" y="142">observed?</text><rect x="480" y="82" width="365" height="82" rx="17" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="662" y="116">2. What is only being</text><text x="662" y="142">proposed?</text><rect x="55" y="194" width="365" height="82" rx="17" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="237" y="228">3. What else could</text><text x="237" y="254">explain it?</text><rect x="480" y="194" width="365" height="82" rx="17" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="662" y="228">4. What useful decision</text><text x="662" y="254">would change?</text></g>
</svg>
