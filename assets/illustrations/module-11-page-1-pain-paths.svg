<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Several pathways can contribute to pain</title><desc id="desc">Paths labelled tissue, nerves and pain processing meet at the lived experience of pain. More than one may be active.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Pain is real; its mechanism may be mixed</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="19" font-weight="700"><rect x="55" y="90" width="190" height="70" rx="18" fill="#fff" stroke="#a83b3b" stroke-width="4"/><text x="150" y="132">Tissue or injury</text><rect x="55" y="185" width="190" height="70" rx="18" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="150" y="227">Nerves</text><rect x="325" y="137" width="210" height="70" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="430" y="179">Pain processing</text><rect x="640" y="120" width="205" height="105" rx="22" fill="#d9f0e6" stroke="#18765b" stroke-width="5"/><text x="742" y="165">Lived experience</text><text x="742" y="191">of pain</text></g><g stroke="#17324d" stroke-width="5"><path d="M245 125l80 35M245 220l80-35M535 172h105"/></g>
</svg>
