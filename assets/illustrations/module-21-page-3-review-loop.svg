<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A setback review loop</title>
  <desc id="desc">Four connected boxes ask what changed, what helped or harmed, what is needed now, and what should be revised.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6c7f8c"/></marker></defs>
  <rect width="900" height="330" rx="24" fill="#f3f0f8"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Review later—without blame</text>
  <g stroke="#6c7f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M225 153 H270"/><path d="M430 153 H475"/><path d="M635 153 H680"/></g>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="35" y="95" width="190" height="115" rx="16" fill="#fff" stroke="#39738c" stroke-width="3"/><text x="130" y="133" font-size="19" font-weight="700">What changed?</text><text x="130" y="169" font-size="15">“unknown” is allowed</text>
    <rect x="270" y="95" width="160" height="115" rx="16" fill="#fff" stroke="#9a3f36" stroke-width="3"/><text x="350" y="128" font-size="18" font-weight="700">Helped or</text><text x="350" y="153" font-size="18" font-weight="700">harmed?</text><text x="350" y="184" font-size="15">include later effects</text>
    <rect x="475" y="95" width="160" height="115" rx="16" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="555" y="128" font-size="18" font-weight="700">What is</text><text x="555" y="153" font-size="18" font-weight="700">needed now?</text><text x="555" y="184" font-size="15">use today’s baseline</text>
    <rect x="680" y="95" width="185" height="115" rx="16" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="773" y="133" font-size="19" font-weight="700">Revise the plan</text><text x="773" y="169" font-size="15">keep it observable</text>
  </g>
  <text x="450" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">The goal is a better next decision—not a perfect explanation.</text>
</svg>
