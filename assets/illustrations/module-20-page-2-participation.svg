<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Several equal paths to meaningful participation</title>
  <desc id="desc">Relationships, learning, creativity and community are shown as equal paths around participation. Paid work is listed as one optional route rather than the centre.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">A meaningful life has more than one path</text>
  <circle cx="450" cy="158" r="72" fill="#fff" stroke="#39738c" stroke-width="4"/><text x="450" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Chosen</text><text x="450" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">participation</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" text-anchor="middle"><rect x="65" y="112" width="180" height="72" rx="18" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="155" y="154">Relationships</text><rect x="655" y="112" width="180" height="72" rx="18" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="745" y="154">Learning</text><rect x="210" y="235" width="180" height="58" rx="18" fill="#fff" stroke="#a66a13" stroke-width="3"/><text x="300" y="270">Creativity</text><rect x="510" y="235" width="180" height="58" rx="18" fill="#fff" stroke="#9a3f36" stroke-width="3"/><text x="600" y="270">Community</text></g>
  <text x="450" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#17324d">Paid work can be one path. It is not the measure of every life.</text>
</svg>
