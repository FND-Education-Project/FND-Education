<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Overlapping dissociative experiences</title><desc id="desc">Three partly overlapping circles show detachment from self, an unreal-feeling world and reduced awareness. They can overlap but are not identical.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Related experiences—not interchangeable words</text>
  <g fill-opacity=".72" stroke-width="4"><circle cx="330" cy="175" r="105" fill="#b9dcec" stroke="#356f99"/><circle cx="450" cy="175" r="105" fill="#cce9dd" stroke="#18765b"/><circle cx="570" cy="175" r="105" fill="#ddd0eb" stroke="#76509a"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="17" font-weight="700"><text x="270" y="150">Detached</text><text x="270" y="175">from self</text><text x="450" y="150">World feels</text><text x="450" y="175">unreal</text><text x="630" y="150">Reduced</text><text x="630" y="175">awareness</text></g>
</svg>
