<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Start measurement with a clinical question</title><desc id="desc">A question leads to the smallest useful record and then a decision to continue, change or stop. A watch alone is not a diagnosis.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Begin with the question—not the device</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><rect x="55" y="115" width="220" height="95" rx="18" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="165" y="153" font-size="20" font-weight="700">What decision</text><text x="165" y="181" font-size="20" font-weight="700">could change?</text><rect x="340" y="115" width="220" height="95" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="450" y="153" font-size="20" font-weight="700">Smallest useful</text><text x="450" y="181" font-size="20" font-weight="700">record</text><rect x="625" y="115" width="220" height="95" rx="18" fill="#d9f0e6" stroke="#18765b" stroke-width="4"/><text x="735" y="145" font-size="19" font-weight="700">Continue, change</text><text x="735" y="173" font-size="19" font-weight="700">or stop</text></g><g stroke="#17324d" stroke-width="5"><path d="M275 162h65M560 162h65"/></g><text x="450" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d">A watch reading can inform a conversation; it is not a diagnosis.</text>
</svg>
