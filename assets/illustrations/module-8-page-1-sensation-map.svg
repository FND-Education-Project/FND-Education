<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A map of different sensory experiences</title>
  <desc id="desc">Three body outlines are labelled less feeling, altered feeling and over-sensitive feeling.</desc>
  <rect width="900" height="330" rx="24" fill="#f7f5ef"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Sensation can change in different ways</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17324d">
    <g transform="translate(145 82)"><circle cx="0" cy="25" r="24" fill="#dcecf7" stroke="#356f99" stroke-width="4"/><path d="M0 52v92m-55-58L0 65l55 21M0 142l-42 73M0 142l42 73" fill="none" stroke="#356f99" stroke-width="13" stroke-linecap="round"/><text x="0" y="238" font-size="20" font-weight="700">Less feeling</text></g>
    <g transform="translate(450 82)"><circle cx="0" cy="25" r="24" fill="#eee4f7" stroke="#76509a" stroke-width="4"/><path d="M0 52v92m-55-58L0 65l55 21M0 142l-42 73M0 142l42 73" fill="none" stroke="#76509a" stroke-width="13" stroke-linecap="round" stroke-dasharray="17 9"/><text x="0" y="238" font-size="20" font-weight="700">Altered feeling</text></g>
    <g transform="translate(755 82)"><circle cx="0" cy="25" r="24" fill="#f9dfe2" stroke="#a43f4c" stroke-width="4"/><path d="M0 52v92m-55-58L0 65l55 21M0 142l-42 73M0 142l42 73" fill="none" stroke="#a43f4c" stroke-width="13" stroke-linecap="round"/><path d="M-80 95h-25m185 0h25M-62 45l-18-18m142 18l18-18" stroke="#a43f4c" stroke-width="6"/><text x="0" y="238" font-size="20" font-weight="700">Over-sensitive</text></g>
  </g>
</svg>
