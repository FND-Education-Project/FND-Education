<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Tremor, jerks, tics and spasms</title>
<desc id="desc">Four definitions: tremor is rhythmic shaking; a jerk is a sudden movement; tics can involve movement or sound; spasm is a word for tightening. These descriptions overlap. History and assessment determine the cause.</desc>
<rect width="900" height="390" rx="24" fill="#f7f5ef"/>
<g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
<text x="450" y="43" font-size="26" font-weight="700">Words for movements and sounds</text>
<rect x="35" y="70" width="400" height="110" rx="18" fill="#fff" stroke="#356f99" stroke-width="2"/><text x="235" y="110" font-size="23" font-weight="700">Tremor</text><text x="235" y="148" font-size="21">Rhythmic shaking</text>
<rect x="465" y="70" width="400" height="110" rx="18" fill="#fff" stroke="#356f99" stroke-width="2"/><text x="665" y="110" font-size="23" font-weight="700">Jerk</text><text x="665" y="148" font-size="21">Sudden movement</text>
<rect x="35" y="205" width="400" height="110" rx="18" fill="#fff" stroke="#356f99" stroke-width="2"/><text x="235" y="245" font-size="23" font-weight="700">Tics / tic-like symptoms</text><text x="235" y="283" font-size="21">Movement or sound</text>
<rect x="465" y="205" width="400" height="110" rx="18" fill="#fff" stroke="#356f99" stroke-width="2"/><text x="665" y="245" font-size="23" font-weight="700">Spasm</text><text x="665" y="283" font-size="21">A word for tightening</text>
<text x="450" y="356" font-size="20">Descriptions can overlap. History and assessment matter.</text>
</g></svg>
