<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A small external thinking system</title><desc id="desc">One capture place connects to a short today list, one home for important objects and one gentle reminder.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Keep the system small and dependable</text>
  <rect x="325" y="80" width="250" height="65" rx="16" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d">One capture place</text>
  <g stroke="#17324d" stroke-width="4"><path d="M450 145v45M450 170H165v20M450 170h285v20"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="18" font-weight="700"><rect x="55" y="190" width="220" height="85" rx="16" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="165" y="240">Short “today” list</text><rect x="340" y="190" width="220" height="85" rx="16" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="450" y="230">One home for</text><text x="450" y="253">important things</text><rect x="625" y="190" width="220" height="85" rx="16" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="735" y="240">One gentle reminder</text></g>
</svg>
