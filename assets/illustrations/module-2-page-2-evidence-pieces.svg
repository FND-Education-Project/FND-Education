<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Different kinds of evidence answer different questions</title><desc id="desc">History, examination, tests and change over time are separate evidence pieces. They meet in an individual clinical assessment while other conditions can still coexist.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">No single result answers every question</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="19" font-weight="700"><rect x="45" y="80" width="180" height="75" rx="16" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="135" y="126">Your history</text><rect x="255" y="80" width="180" height="75" rx="16" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="345" y="126">Examination</text><rect x="465" y="80" width="180" height="75" rx="16" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="555" y="126">Suitable tests</text><rect x="675" y="80" width="180" height="75" rx="16" fill="#fff" stroke="#a66500" stroke-width="4"/><text x="765" y="114">Change over</text><text x="765" y="138">time</text><rect x="270" y="205" width="360" height="80" rx="18" fill="#fff0c7" stroke="#17324d" stroke-width="4"/><text x="450" y="237">Individual assessment</text><text x="450" y="264" font-size="17" font-weight="400">FND and another condition may both be present</text></g>
  <g stroke="#17324d" stroke-width="4" fill="none"><path d="M135 155v30h315v20"/><path d="M345 155v30h105v20"/><path d="M555 155v30H450v20"/><path d="M765 155v30H450v20"/></g>
</svg>
