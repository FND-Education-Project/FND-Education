<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A message can travel by several communication routes</title>
  <desc id="desc">Speech, writing, gesture and a device all point from one person toward a shared message.</desc>
  <rect width="900" height="330" rx="24" fill="#f7f5ef"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Communication is bigger than speech</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17324d">
    <rect x="35" y="78" width="170" height="70" rx="18" fill="#dcecf7" stroke="#356f99" stroke-width="3"/><text x="120" y="122" font-size="21" font-weight="700">Speech</text>
    <rect x="35" y="177" width="170" height="70" rx="18" fill="#fff0c7" stroke="#a66500" stroke-width="3"/><text x="120" y="221" font-size="21" font-weight="700">Writing</text>
    <rect x="695" y="78" width="170" height="70" rx="18" fill="#eee4f7" stroke="#76509a" stroke-width="3"/><text x="780" y="122" font-size="21" font-weight="700">Gesture</text>
    <rect x="695" y="177" width="170" height="70" rx="18" fill="#f9dfe2" stroke="#a43f4c" stroke-width="3"/><text x="780" y="221" font-size="21" font-weight="700">Device</text>
    <path d="M220 113l155 47M220 212l155-32M680 113l-155 47M680 212l-155-32" stroke="#17324d" stroke-width="5"/>
    <rect x="375" y="115" width="150" height="110" rx="55" fill="#d9f0e6" stroke="#18765b" stroke-width="4"/><text x="450" y="165" font-size="23" font-weight="700">My</text><text x="450" y="196" font-size="23" font-weight="700">message</text>
  </g>
</svg>
