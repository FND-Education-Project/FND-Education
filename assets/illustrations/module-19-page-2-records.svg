<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Four clear parts of a health record</title>
  <desc id="desc">Four boxes separate confirmed information, unresolved uncertainty, what has changed, and the next step.</desc>
  <rect width="900" height="330" rx="24" fill="#f3f0f8"/>
  <text x="450" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Keep fact, uncertainty and action separate</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="45" y="92" width="190" height="118" rx="18" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="140" y="130" font-size="20" font-weight="700">Confirmed</text><text x="140" y="164" font-size="16">What is known?</text>
    <rect x="252" y="92" width="190" height="118" rx="18" fill="#fff" stroke="#a66a13" stroke-width="3"/><text x="347" y="130" font-size="20" font-weight="700">Uncertain</text><text x="347" y="164" font-size="16">What remains open?</text>
    <rect x="459" y="92" width="190" height="118" rx="18" fill="#fff" stroke="#9a3f36" stroke-width="3"/><text x="554" y="130" font-size="20" font-weight="700">Changed</text><text x="554" y="164" font-size="16">What is new?</text>
    <rect x="666" y="92" width="190" height="118" rx="18" fill="#fff" stroke="#39738c" stroke-width="3"/><text x="761" y="130" font-size="20" font-weight="700">Next</text><text x="761" y="164" font-size="16">Who does what, when?</text>
  </g>
  <text x="450" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">“Not yet known” is honest information.</text>
</svg>
