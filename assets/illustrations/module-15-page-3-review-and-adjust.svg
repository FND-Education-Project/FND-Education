<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Delayed worsening can guide the next decision</title>
  <desc id="desc">A sequence shows activity, a possible delay, a short check of symptoms and function, then three possible responses: repeat, adapt, or seek clinical review.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Check later—then choose the next response</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="45" y="84" width="180" height="78" rx="17" fill="#fff" stroke="#2e6e9e" stroke-width="3"/><text x="135" y="118" font-size="19" font-weight="700">Activity</text><text x="135" y="145" font-size="16">what + how much</text>
    <rect x="265" y="84" width="160" height="78" rx="17" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="345" y="118" font-size="19" font-weight="700">Delay</text><text x="345" y="145" font-size="16">hours or longer</text>
    <rect x="465" y="84" width="220" height="78" rx="17" fill="#fff0c7" stroke="#a86700" stroke-width="3"/><text x="575" y="118" font-size="19" font-weight="700">Short check</text><text x="575" y="145" font-size="16">symptoms + function</text>
  </g>
  <g stroke="#17324d" stroke-width="4"><path d="M225 123 H265"/><path d="M425 123 H465"/><path d="M685 123 H755"/></g>
  <circle cx="792" cy="123" r="36" fill="#fff" stroke="#18785b" stroke-width="3"/>
  <text x="792" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17324d">Next</text><text x="792" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17324d">decision</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d" text-anchor="middle">
    <rect x="170" y="225" width="160" height="54" rx="14" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="250" y="258">Repeat</text>
    <rect x="370" y="225" width="160" height="54" rx="14" fill="#fff" stroke="#a86700" stroke-width="3"/><text x="450" y="258">Adapt</text>
    <rect x="570" y="225" width="190" height="54" rx="14" fill="#fff" stroke="#9a3f36" stroke-width="3"/><text x="665" y="258">Clinical review</text>
  </g>
  <path d="M792 159 C792 200 665 200 665 225 M792 159 C792 200 450 200 450 225 M792 159 C792 200 250 200 250 225" fill="none" stroke="#17324d" stroke-width="3"/>
  <text x="450" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#17324d">A flare is information—not a moral score and not automatically FND.</text>
</svg>
