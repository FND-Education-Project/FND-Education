<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Four sections of a Personal FND Handbook</title>
  <desc id="desc">The handbook groups health facts, usual patterns, support and access needs, and plans and contacts.</desc>
  <rect width="900" height="330" rx="24" fill="#eef4f6"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Keep only information with a job</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="35" y="85" width="195" height="145" rx="16" fill="#fff" stroke="#39738c" stroke-width="3"/><text x="133" y="126" font-size="20" font-weight="700">Health facts</text><text x="133" y="162" font-size="15">diagnoses · medicines</text><text x="133" y="188" font-size="15">open questions</text>
    <rect x="247" y="85" width="195" height="145" rx="16" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="345" y="126" font-size="20" font-weight="700">Usual patterns</text><text x="345" y="162" font-size="15">warnings · recovery</text><text x="345" y="188" font-size="15">meaningful change</text>
    <rect x="459" y="85" width="195" height="145" rx="16" fill="#fff" stroke="#a66a13" stroke-width="3"/><text x="557" y="121" font-size="19" font-weight="700">Support</text><text x="557" y="146" font-size="19" font-weight="700">and access</text><text x="557" y="183" font-size="15">helps · makes harder</text>
    <rect x="671" y="85" width="195" height="145" rx="16" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="769" y="121" font-size="19" font-weight="700">Plans</text><text x="769" y="146" font-size="19" font-weight="700">and contacts</text><text x="769" y="183" font-size="15">roles · next steps</text>
  </g>
  <text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Keep confirmed information separate from uncertainty.</text>
</svg>
