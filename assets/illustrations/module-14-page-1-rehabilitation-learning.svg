<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Rehabilitation is a learning and adjustment loop</title>
  <desc id="desc">Four connected boxes show a chosen activity, a suitable attempt, feedback, and adjustment. A support bar underneath shows that access supports can remain throughout.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Rehabilitation: try, notice and adjust</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d" text-anchor="middle">
    <rect x="46" y="92" width="180" height="80" rx="17" fill="#fff" stroke="#2e6e9e" stroke-width="3"/><text x="136" y="127">Chosen activity</text><text x="136" y="152" font-size="16" font-weight="400">Why does it matter?</text>
    <rect x="255" y="92" width="180" height="80" rx="17" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="345" y="127">Suitable attempt</text><text x="345" y="152" font-size="16" font-weight="400">Support + amount</text>
    <rect x="464" y="92" width="180" height="80" rx="17" fill="#fff0c7" stroke="#a86700" stroke-width="3"/><text x="554" y="127">Feedback</text><text x="554" y="152" font-size="16" font-weight="400">Now and later</text>
    <rect x="673" y="92" width="180" height="80" rx="17" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="763" y="127">Adjustment</text><text x="763" y="152" font-size="16" font-weight="400">Repeat or change</text>
  </g>
  <g stroke="#17324d" stroke-width="4"><path d="M226 132 H255"/><path d="M435 132 H464"/><path d="M644 132 H673"/></g>
  <path d="M763 172 C763 225 136 225 136 172" fill="none" stroke="#17324d" stroke-width="3" stroke-dasharray="8 7"/>
  <rect x="125" y="242" width="650" height="52" rx="16" fill="#fff" stroke="#18785b" stroke-width="3"/>
  <text x="450" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17324d"><tspan font-weight="700">Access supports throughout:</tspan> adaptations · equipment · help · recovery</text>
</svg>
