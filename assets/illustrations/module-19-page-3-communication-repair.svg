<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A stepped route after healthcare communication breaks down</title>
  <desc id="desc">Steps rise from pause, to name the problem, to ask for clarification or support, to use another opinion or formal route. A person can start where it fits.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Start at the step that fits</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="55" y="210" width="170" height="58" rx="12" fill="#fff" stroke="#39738c" stroke-width="3"/><text x="140" y="246" font-size="19" font-weight="700">Pause</text>
    <rect x="245" y="165" width="190" height="103" rx="12" fill="#fff" stroke="#a66a13" stroke-width="3"/><text x="340" y="205" font-size="19" font-weight="700">Name the problem</text><text x="340" y="235" font-size="15">and needed outcome</text>
    <rect x="455" y="115" width="190" height="153" rx="12" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="550" y="160" font-size="19" font-weight="700">Clarify</text><text x="550" y="190" font-size="15">add writing, time</text><text x="550" y="214" font-size="15">or support</text>
    <rect x="665" y="70" width="180" height="198" rx="12" fill="#f3f0f8" stroke="#7350a0" stroke-width="3"/><text x="755" y="117" font-size="19" font-weight="700">Another route</text><text x="755" y="150" font-size="15">second opinion</text><text x="755" y="174" font-size="15">advocate</text><text x="755" y="198" font-size="15">formal process</text>
  </g>
  <text x="450" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">You need not return to an unsafe clinician or complete every step.</text>
</svg>
