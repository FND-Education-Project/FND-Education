<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Brain functions depend on connected networks</title><desc id="desc">Four connected nodes represent sensation, prediction, attention and action or agency. The network is presented as a useful research model rather than a complete explanation for one person.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">A network is a group of parts working together</text>
  <g stroke="#17324d" stroke-width="5" fill="none"><path d="M270 145h120"/><path d="M510 145h120"/><path d="M450 190v55"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="19" font-weight="700"><circle cx="180" cy="145" r="86" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="180" y="151">Sensation</text><circle cx="450" cy="145" r="86" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="450" y="139">Prediction and</text><text x="450" y="166">attention</text><circle cx="720" cy="145" r="86" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="720" y="139">Action and</text><text x="720" y="166">agency</text><rect x="310" y="245" width="280" height="58" rx="16" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="450" y="281">Useful model—not the whole story</text></g>
</svg>
