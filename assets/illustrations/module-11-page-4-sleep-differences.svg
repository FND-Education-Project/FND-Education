<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Different sleep problems need different assessment</title><desc id="desc">Cards show trouble falling asleep, breathing pauses, restless legs and a shifted body clock.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">“Poor sleep” can mean different things</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><rect x="35" y="105" width="185" height="120" rx="18" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="127" y="155" font-size="20" font-weight="700">Can’t fall</text><text x="127" y="183" font-size="18">asleep</text><rect x="250" y="105" width="185" height="120" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="342" y="155" font-size="20" font-weight="700">Breathing</text><text x="342" y="183" font-size="18">pauses</text><rect x="465" y="105" width="185" height="120" rx="18" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="557" y="155" font-size="20" font-weight="700">Restless</text><text x="557" y="183" font-size="18">legs</text><rect x="680" y="105" width="185" height="120" rx="18" fill="#fff" stroke="#a66500" stroke-width="4"/><text x="772" y="155" font-size="20" font-weight="700">Shifted</text><text x="772" y="183" font-size="18">body clock</text></g><text x="450" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324d">The description guides the next question or test.</text>
</svg>
