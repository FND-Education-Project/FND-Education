<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Access now and gradual change are separate choices</title>
  <desc id="desc">Two parallel lanes show accommodations for access now and optional, consent-based gradual practice over time.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Two needs can exist at the same time</text>
  <g font-family="Arial, sans-serif" fill="#17324d">
    <rect x="55" y="88" width="790" height="82" rx="22" fill="#d9f0e6" stroke="#18765b" stroke-width="4"/>
    <text x="90" y="122" font-size="22" font-weight="700">Access now</text><text x="90" y="150" font-size="18">Reduce load so a person can enter, communicate or take part.</text>
    <path d="M650 129h145" stroke="#18765b" stroke-width="7"/><path d="M795 129l-18-12v24z" fill="#18765b"/>
    <rect x="55" y="205" width="790" height="82" rx="22" fill="#eee4f7" stroke="#76509a" stroke-width="4"/>
    <text x="90" y="239" font-size="22" font-weight="700">Gradual change</text><text x="90" y="267" font-size="18">If chosen, practise a small tolerable amount and review the response.</text>
    <path d="M650 246h145" stroke="#76509a" stroke-width="7" stroke-dasharray="14 9"/><path d="M795 246l-18-12v24z" fill="#76509a"/>
  </g>
</svg>
