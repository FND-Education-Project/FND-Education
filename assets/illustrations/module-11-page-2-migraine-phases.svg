<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Possible phases of a migraine attack</title><desc id="desc">Four cards show early change, possible aura, headache or other attack symptoms, and recovery. Not everyone has every phase.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Migraine is more than the headache phase</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><rect x="35" y="110" width="185" height="105" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="127" y="154" font-size="20" font-weight="700">Early change</text><text x="127" y="184" font-size="16">mood, neck, energy</text><rect x="250" y="110" width="185" height="105" rx="18" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="342" y="154" font-size="20" font-weight="700">Possible aura</text><text x="342" y="184" font-size="16">temporary symptoms</text><rect x="465" y="110" width="185" height="105" rx="18" fill="#fff" stroke="#a83b3b" stroke-width="4"/><text x="557" y="150" font-size="20" font-weight="700">Attack</text><text x="557" y="180" font-size="16">pain or other signs</text><rect x="680" y="110" width="185" height="105" rx="18" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="772" y="154" font-size="20" font-weight="700">Recovery</text><text x="772" y="184" font-size="16">fatigue or fog</text></g><text x="450" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#17324d">Not everyone has every phase or the same order.</text>
</svg>
