<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A positive sign compares how a function behaves</title><desc id="desc">A clinician observes the same function in two suitable tasks. A meaningful difference can support an FND diagnosis but is only one part of an individual assessment.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">A positive sign is something the clinician observes</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><rect x="60" y="98" width="235" height="120" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="177" y="144" font-size="20" font-weight="700">Function during</text><text x="177" y="175" font-size="20" font-weight="700">one task</text><rect x="605" y="98" width="235" height="120" rx="18" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="722" y="144" font-size="20" font-weight="700">Same function in</text><text x="722" y="175" font-size="20" font-weight="700">another task</text><circle cx="450" cy="158" r="74" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="450" y="151" font-size="19" font-weight="700">Clinician</text><text x="450" y="178" font-size="19" font-weight="700">compares</text></g>
  <g stroke="#17324d" stroke-width="5" fill="none"><path d="M295 158h75"/><path d="M530 158h75"/></g><text x="450" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d">A difference may support FND; it is not a test of honesty.</text>
</svg>
