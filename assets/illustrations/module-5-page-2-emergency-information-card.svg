<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">A short emergency information card</title>
  <desc id="desc">A card lists the essential information another person may need during a difficult event.</desc>
  <rect width="900" height="320" rx="24" fill="#eef5f7"/>
  <rect x="90" y="38" width="720" height="244" rx="20" fill="#ffffff" stroke="#286b78" stroke-width="4"/>
  <rect x="90" y="38" width="720" height="54" rx="18" fill="#286b78"/>
  <text x="450" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">My short emergency information</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#17324d">
    <circle cx="132" cy="125" r="9" fill="#43a889"/><text x="154" y="132">Who I am and my confirmed diagnoses</text>
    <circle cx="132" cy="165" r="9" fill="#43a889"/><text x="154" y="172">What my familiar events look like</text>
    <circle cx="132" cy="205" r="9" fill="#43a889"/><text x="154" y="212">What helps, what harms and when to escalate</text>
    <circle cx="132" cy="245" r="9" fill="#43a889"/><text x="154" y="252">Medicines, contacts and review date</text>
  </g>
</svg>
