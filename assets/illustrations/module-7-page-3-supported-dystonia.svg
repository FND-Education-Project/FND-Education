<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Support a painful posture without forcing it</title>
  <desc id="desc">A curved limb rests on soft supports while a stop sign marks forceful straightening.</desc>
  <rect width="900" height="320" rx="24" fill="#eef5f7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Comfort and safety come first</text>
  <path d="M180 125c105 10 110 115 225 110s130-90 220-80" fill="none" stroke="#17324d" stroke-width="26" stroke-linecap="round"/>
  <path d="M245 232h300" stroke="#18765b" stroke-width="18" stroke-linecap="round"/>
  <path d="M285 222q45-65 90 0M440 222q45-65 90 0" fill="#d9f0e6" stroke="#18765b" stroke-width="5"/>
  <g font-family="Arial, sans-serif" fill="#17324d"><text x="380" y="285" text-anchor="middle" font-size="20">comfortable support</text></g>
  <circle cx="735" cy="170" r="64" fill="#f9dfe2" stroke="#a43f4c" stroke-width="7"/><path d="M692 127l86 86M778 127l-86 86" stroke="#a43f4c" stroke-width="12" stroke-linecap="round"/>
  <text x="735" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7b2934">Do not force</text>
</svg>
