<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Two descriptive activity patterns</title>
  <desc id="desc">The top line has high activity peaks followed by deep drops. The lower line uses smaller flexible amounts with planned space. Neither is labelled good or bad, and a note says patterns are not moral scores.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Patterns can be noticed without blame</text>
  <g font-family="Arial, sans-serif" fill="#17324d">
    <text x="55" y="101" font-size="18" font-weight="700">Peaks and drops</text>
    <line x1="205" y1="96" x2="850" y2="96" stroke="#b5c7d2" stroke-width="2"/>
    <polyline points="205,112 275,58 340,147 420,72 498,155 575,64 650,143 730,78 850,132" fill="none" stroke="#9a3f36" stroke-width="6" stroke-linejoin="round"/>
    <text x="55" y="215" font-size="18" font-weight="700">Smaller, flexible</text>
    <line x1="205" y1="210" x2="850" y2="210" stroke="#b5c7d2" stroke-width="2"/>
    <polyline points="205,220 270,190 335,214 400,181 465,211 530,186 595,219 660,192 725,211 790,183 850,207" fill="none" stroke="#18785b" stroke-width="6" stroke-linejoin="round"/>
    <g stroke="#7350a0" stroke-width="3"><line x1="335" y1="176" x2="335" y2="235"/><line x1="595" y1="176" x2="595" y2="235"/></g>
    <text x="335" y="257" font-size="15" text-anchor="middle">planned space</text><text x="595" y="257" font-size="15" text-anchor="middle">planned space</text>
  </g>
  <text x="450" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">A line describes activity—not effort, character or illness severity.</text>
</svg>
