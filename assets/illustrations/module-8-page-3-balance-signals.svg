<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Three kinds of information contribute to balance</title>
  <desc id="desc">Vision, inner-ear signals and body-sensation signals point toward a central balance system.</desc>
  <rect width="900" height="330" rx="24" fill="#f7f5ef"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Balance combines several streams of information</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17324d">
    <rect x="45" y="95" width="190" height="85" rx="20" fill="#dcecf7" stroke="#356f99" stroke-width="4"/><text x="140" y="132" font-size="22" font-weight="700">Vision</text><text x="140" y="160" font-size="17">what you see</text>
    <rect x="45" y="215" width="190" height="85" rx="20" fill="#eee4f7" stroke="#76509a" stroke-width="4"/><text x="140" y="252" font-size="22" font-weight="700">Inner ears</text><text x="140" y="280" font-size="17">motion and gravity</text>
    <rect x="665" y="155" width="190" height="85" rx="20" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="760" y="192" font-size="22" font-weight="700">Body signals</text><text x="760" y="220" font-size="17">position and pressure</text>
    <path d="M250 137h120M250 257l120-55M650 197h-120" stroke="#17324d" stroke-width="5"/><path d="M370 137l-14-10v20zM370 202l-16-3 8 18zM530 197l14-10v20z" fill="#17324d"/>
    <circle cx="450" cy="175" r="88" fill="#d9f0e6" stroke="#18765b" stroke-width="5"/><text x="450" y="168" font-size="25" font-weight="700">Balance</text><text x="450" y="201" font-size="18">uses them together</text>
  </g>
</svg>
