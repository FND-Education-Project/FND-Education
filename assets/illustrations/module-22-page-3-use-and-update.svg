<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Four features of a usable and current handbook</title>
  <desc id="desc">A usable handbook has one main home, a short front page, a visible review date, and a protected backup.</desc>
  <rect width="900" height="330" rx="24" fill="#eef4f6"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Can I find it, trust it and use it?</text>
  <g font-family="Arial, sans-serif" fill="#17324d" text-anchor="middle">
    <rect x="40" y="95" width="185" height="115" rx="16" fill="#fff" stroke="#39738c" stroke-width="3"/><text x="133" y="130" font-size="19" font-weight="700">One main home</text><text x="133" y="168" font-size="15">easy to find</text>
    <rect x="252" y="95" width="185" height="115" rx="16" fill="#fff" stroke="#18785b" stroke-width="3"/><text x="345" y="130" font-size="19" font-weight="700">Short front page</text><text x="345" y="168" font-size="15">urgent items first</text>
    <rect x="464" y="95" width="185" height="115" rx="16" fill="#fff" stroke="#a66a13" stroke-width="3"/><text x="557" y="130" font-size="19" font-weight="700">Review date</text><text x="557" y="168" font-size="15">shows what is current</text>
    <rect x="676" y="95" width="185" height="115" rx="16" fill="#fff" stroke="#7350a0" stroke-width="3"/><text x="769" y="130" font-size="19" font-weight="700">Protected backup</text><text x="769" y="168" font-size="15">restore if needed</text>
  </g>
  <text x="450" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Share each section only in ways you choose.</text>
</svg>
