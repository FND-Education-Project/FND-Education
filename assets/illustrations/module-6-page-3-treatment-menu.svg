<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">An individualized treatment menu</title>
  <desc id="desc">Several possible care components surround a central message that there is no single recipe.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Treatment may combine different parts</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="18" fill="#17324d">
    <rect x="40" y="82" width="210" height="75" rx="18" fill="#ffffff" stroke="#356f99" stroke-width="3"/><text x="145" y="115">Clear explanation</text><text x="145" y="140">and continuity</text>
    <rect x="40" y="190" width="210" height="75" rx="18" fill="#ffffff" stroke="#356f99" stroke-width="3"/><text x="145" y="223">Episode and</text><text x="145" y="248">recovery plan</text>
    <rect x="650" y="82" width="210" height="75" rx="18" fill="#ffffff" stroke="#356f99" stroke-width="3"/><text x="755" y="115">Chosen therapy</text><text x="755" y="140">when suitable</text>
    <rect x="650" y="190" width="210" height="75" rx="18" fill="#ffffff" stroke="#356f99" stroke-width="3"/><text x="755" y="223">Care for other</text><text x="755" y="248">health needs</text>
    <rect x="305" y="105" width="290" height="140" rx="70" fill="#d9f0e6" stroke="#18765b" stroke-width="4"/>
    <text x="450" y="160" font-size="24" font-weight="700">No single recipe</text>
    <text x="450" y="195" font-size="19">Choose together</text>
    <text x="450" y="220" font-size="19">and review</text>
  </g>
</svg>
