<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">A symptom interaction loop with several entry points</title><desc id="desc">Pain, poor sleep, lower capacity and overactivity form a loop. Small exit ramps show that a helpful change can begin at more than one point.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">A loop offers more than one entry point</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="18" font-weight="700"><rect x="105" y="80" width="190" height="65" rx="16" fill="#f7d6d6" stroke="#a83b3b" stroke-width="4"/><text x="200" y="120">Pain or migraine</text><rect x="605" y="80" width="190" height="65" rx="16" fill="#ddd0eb" stroke="#76509a" stroke-width="4"/><text x="700" y="120">Poor sleep</text><rect x="605" y="215" width="190" height="65" rx="16" fill="#b9dcec" stroke="#356f99" stroke-width="4"/><text x="700" y="255">Lower capacity</text><rect x="105" y="215" width="190" height="65" rx="16" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="200" y="255">Overactivity</text></g><g fill="none" stroke="#17324d" stroke-width="5"><path d="M295 112h310M700 145v70M605 247H295M200 215v-70"/></g><circle cx="450" cy="180" r="58" fill="#d9f0e6" stroke="#18765b" stroke-width="4"/><text x="450" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">Start with</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">one part</text>
</svg>
