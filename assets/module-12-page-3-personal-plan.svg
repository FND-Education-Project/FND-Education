<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Four parts of a personal autonomic symptom plan</title><desc id="desc">A one-page plan has four boxes: my usual pattern, what helps access, agreed treatment, and when to seek help.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">A short plan for a hard moment</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="19" font-weight="700"><rect x="80" y="80" width="335" height="90" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="247" y="132">1. My usual pattern</text><rect x="485" y="80" width="335" height="90" rx="18" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="652" y="120">2. What helps</text><text x="652" y="145">access</text><rect x="80" y="200" width="335" height="90" rx="18" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="247" y="252">3. Agreed treatment</text><rect x="485" y="200" width="335" height="90" rx="18" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="652" y="240">4. When to</text><text x="652" y="265">seek help</text></g>
</svg>
