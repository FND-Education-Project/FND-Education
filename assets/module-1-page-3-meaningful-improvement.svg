<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Improvement can take several meaningful forms</title><desc id="desc">Four paths lead toward fewer symptoms, safer days, more participation and better quality of life. None is shown as the only valid outcome.</desc>
  <rect width="900" height="330" rx="24" fill="#eef5f7"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d">Improvement is wider than one finish line</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d" font-size="18" font-weight="700"><rect x="45" y="105" width="180" height="105" rx="18" fill="#fff" stroke="#356f99" stroke-width="4"/><text x="135" y="151">Fewer or milder</text><text x="135" y="178">symptoms</text><rect x="255" y="105" width="180" height="105" rx="18" fill="#fff" stroke="#18765b" stroke-width="4"/><text x="345" y="151">Safer, more</text><text x="345" y="178">manageable days</text><rect x="465" y="105" width="180" height="105" rx="18" fill="#fff" stroke="#76509a" stroke-width="4"/><text x="555" y="151">More choice or</text><text x="555" y="178">participation</text><rect x="675" y="105" width="180" height="105" rx="18" fill="#fff0c7" stroke="#a66500" stroke-width="4"/><text x="765" y="151">Better quality</text><text x="765" y="178">of life</text></g>
  <text x="450" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#17324d">A person may value one, several or different outcomes over time.</text>
</svg>
