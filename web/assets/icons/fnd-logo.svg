<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title logo-description">
<title id="logo-title">FND Education Project logo</title>
<desc id="logo-description">A white bold hand-drawn F on a teal rounded square, with a gold inset border that becomes a gentle irregular wave down one edge.</desc>
<rect width="64" height="64" rx="12" fill="#176b78"/>

<defs>
