  </linearGradient>
  <linearGradient id="fade-wave" x1="53" y1="17" x2="53" y2="51" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#efc365" stop-opacity="0"/>
    <stop offset=".25" stop-color="#efc365"/>
    <stop offset=".62" stop-color="#efc365"/>
    <stop offset="1" stop-color="#efc365" stop-opacity=".12"/>
  </linearGradient>
</defs>


