name: Audit Legacy Crossword PDF Grids

on:
  push:
    branches:
      - audit/course-align-m01-m02-archive-and-pass1
    paths:
      - tools/puzzles/audit_pdf_grids.py
      - .github/workflows/audit-legacy-crosswords.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF inspector
        run: python -m pip install pymupdf==1.26.5
      - name: Inspect all existing puzzles without modifying them
        run: python tools/puzzles/audit_pdf_grids.py
