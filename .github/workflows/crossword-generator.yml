name: Check educational crossword generator

on:
  pull_request:
    paths:
      - "tools/puzzles/crossword_builder/**"
      - "tools/puzzles/generate_crosswords.py"
      - "tools/puzzles/crossword_app.py"
      - "tools/puzzles/crossword_app.py"
      - "tools/puzzles/requirements-crosswords.txt"
      - "tools/puzzles/tests/test_crossword_builder.py"
      - ".github/workflows/crossword-generator.yml"
  push:
    branches: [main]
    paths:
      - "tools/puzzles/crossword_builder/**"
      - "tools/puzzles/generate_crosswords.py"
      - "tools/puzzles/requirements-crosswords.txt"
      - "tools/puzzles/tests/test_crossword_builder.py"
      - ".github/workflows/crossword-generator.yml"

permissions:
  contents: read

jobs:
  validate-crosswords:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/puzzles/requirements-crosswords.txt
      - name: Install crossword dependencies
        run: python -m pip install -r tools/puzzles/requirements-crosswords.txt
      - name: Compile Python files
        run: python -m compileall -q tools/puzzles/crossword_builder tools/puzzles/generate_crosswords.py tools/puzzles/crossword_app.py
      - name: Run workbook, placement, PDF and form regression checks
        run: python -m unittest discover -s tools/puzzles/tests -p "test_crossword_builder.py" -v
