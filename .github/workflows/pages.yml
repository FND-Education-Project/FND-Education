name: Build and deploy Pages

on:
  push:
    branches:
      - main
      - migrate-to-pages
  pull_request:
    branches:
      - main
      - migrate-to-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test learner API contract and browser JavaScript syntax
        run: |
          node --check tools/learner-cloudflare/worker.js
          node --check web/assets/js/account-shell.js
          node --check web/assets/js/course-progress.js
          node --test tools/learner-cloudflare/test-*.mjs

      - name: Prepare website source
        run: python tools/site/prepare_site.py

      - name: Check curriculum identity and navigation
        run: python -m unittest discover -s tools/site/tests -v

      - name: Validate generated source
        run: python tools/site/validate.py

      - name: Build Jekyll artifact
        run: bundle exec jekyll build --source web --destination _site
        env:
          JEKYLL_ENV: production

      - name: Apply reviewed subject search metadata
        run: |
          python tools/search/build_subject_metadata.py \
            --site _site \
            --cache-only \
            --report /tmp/fnd-search-subject-report.json

      - name: Build Pagefind search index
        run: npx --yes pagefind@1.5.2 --site _site

      - name: Validate built artifact
        run: python tools/site/validate.py --built-site _site

      - name: Check desktop and mobile course rendering
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node tools/site/tests/verify_rendered_course.cjs

      - name: Upload browser review evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: course-browser-review
          path: /tmp/course-browser-review/
          retention-days: 3

      - name: Upload pull request HTML for visual review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: course-html-review
          path: |
            _site/**/*.html
            _site/assets/css/
            _site/assets/js/
          retention-days: 3

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
