name: Validate first-party aggregate analytics

on:
  pull_request:
    paths:
      - "tools/analytics/cloudflare/**"
      - "web/assets/js/analytics.js"
      - "web/assets/js/search.js"
      - "web/_layouts/default.html"
      - "web/_layouts/home.html"
      - "web/_config.yml"
      - "web/search/index.html"
      - ".github/workflows/privacy-analytics.yml"
  push:
    branches: [main]
    paths:
      - "tools/analytics/cloudflare/**"
      - "web/assets/js/analytics.js"
      - "web/assets/js/search.js"
      - "web/_layouts/default.html"
      - "web/_layouts/home.html"
      - "web/_config.yml"
      - "web/search/index.html"
      - ".github/workflows/privacy-analytics.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser and Worker script syntax
        run: |
          node --check web/assets/js/analytics.js
          node --check web/assets/js/search.js
          node --check tools/analytics/cloudflare/src/worker.mjs
          node --check tools/analytics/cloudflare/src/admin-worker.mjs
          node --check tools/analytics/cloudflare/src/admin-dashboard.mjs
      - name: Validate anonymous-only Worker behaviour
        run: node --test tools/analytics/cloudflare/tests/worker.test.mjs
      - name: Validate separately protected private dashboard Worker
        run: node --test tools/analytics/cloudflare/tests/admin-worker.test.mjs
      - name: Require public privacy notice for analytics activation
        run: |
          if grep -Eq '^[[:space:]]*analytics_endpoint:[[:space:]]*https://' web/_config.yml; then
            if ! grep -Fq 'class="home-privacy"' web/_layouts/home.html ||
               ! grep -Fq 'We count how often pages are opened' web/_layouts/home.html; then
              echo "::error::Cannot enable analytics without the approved home-page privacy notice."
              exit 1
            fi
            echo "Analytics endpoint and public privacy notice are both configured."
          elif grep -Eq '^[[:space:]]*analytics_endpoint:' web/_config.yml; then
            echo "::error::Analytics endpoint must use an HTTPS URL or be omitted."
            exit 1
          else
            echo "Analytics remains disabled."
          fi
